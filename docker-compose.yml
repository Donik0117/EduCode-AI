services:
  db:
    image: postgres:16-alpine
    container_name: educode-ai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: educode_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - educode_ai_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d educode_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  educode_ai_postgres:
